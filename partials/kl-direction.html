<figure class="interactive-figure" data-viz="kl-direction">
  <figcaption>图 2 · 在三个候选分布中切换 KL 方向，观察最小化结果。</figcaption>
  <div class="figure-controls kl-controls">
    <div class="segmented" role="group" aria-label="KL 散度方向">
      <button type="button" data-direction="forward" aria-pressed="true">D(P‖Q) · forward</button>
      <button type="button" data-direction="reverse" aria-pressed="false">D(Q‖P) · reverse</button>
    </div>
    <label for="kl-candidate">显示候选</label>
    <select id="kl-candidate"><option value="best">当前最优</option><option value="cover">覆盖两个峰</option><option value="left">偏向左峰</option><option value="right">偏向右峰</option></select>
  </div>
  <div class="figure-legend" aria-hidden="true"><span class="legend-target">目标 P</span><span class="legend-candidate">候选 Q</span></div>
  <div class="distribution-chart" role="img" aria-label="三个位置上目标分布 P 与当前候选 Q 的概率质量比较">
    <div class="distribution-row" data-index="0"><strong>x = −1</strong><div class="bar-pair"><div class="bar-track"><span class="bar-target" style="width:49%"></span></div><div class="bar-track"><span class="bar-candidate"></span></div></div><span class="bar-values"></span></div>
    <div class="distribution-row" data-index="1"><strong>x = 0</strong><div class="bar-pair"><div class="bar-track"><span class="bar-target" style="width:2%"></span></div><div class="bar-track"><span class="bar-candidate"></span></div></div><span class="bar-values"></span></div>
    <div class="distribution-row" data-index="2"><strong>x = +1</strong><div class="bar-pair"><div class="bar-track"><span class="bar-target" style="width:49%"></span></div><div class="bar-track"><span class="bar-candidate"></span></div></div><span class="bar-values"></span></div>
  </div>
  <p class="viz-result" id="kl-result" aria-live="polite"></p>
  <table class="kl-table"><caption>三个候选的 KL 散度（nat；数值越小越好）</caption><thead><tr><th scope="col">候选 Q</th><th scope="col">D(P‖Q)</th><th scope="col">D(Q‖P)</th></tr></thead><tbody><tr data-candidate="cover"><th scope="row">覆盖两个峰</th><td></td><td></td></tr><tr data-candidate="left"><th scope="row">偏向左峰</th><td></td><td></td></tr><tr data-candidate="right"><th scope="row">偏向右峰</th><td></td><td></td></tr></tbody></table>
</figure>
