name: Restart original Pages deployment

on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-pages.yml]

permissions:
  actions: write
  pages: read

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect backend and rerun original deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - << "PYTHON"
          import json, os, urllib.request
          base = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"]
          headers = {"Accept": "application/vnd.github+json", "Authorization": "Bearer " + os.environ["GH_TOKEN"], "X-GitHub-Api-Version": "2022-11-28"}
          req = urllib.request.Request(base + "/pages/deployments/a86baad677450949f32710b6d2e9afbad3f31138", headers=headers)
          with urllib.request.urlopen(req, timeout=30) as r:
              print("::notice::Backend state: " + r.read().decode())
          req = urllib.request.Request(base + "/actions/runs/42051368961/rerun-failed-jobs", headers=headers, method="POST")
          with urllib.request.urlopen(req, timeout=30) as r:
              assert r.status == 201
              print("::notice::Original Pages deployment restarted")
          PYTHON
