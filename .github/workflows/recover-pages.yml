name: Inspect stalled Pages deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-pages.yml

permissions:
  pages: write

jobs:
  inspect-and-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect and await Pages cancellation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - << "PYTHON"
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          url = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/pages/deployments/a86baad677450949f32710b6d2e9afbad3f31138"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def notice(value):
              print("::notice::" + json.dumps(value).replace("%", "%25"), flush=True)
          def request(method, target):
              req = urllib.request.Request(target, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read().decode()
                      data = json.loads(raw) if raw else {}
                      notice({"method": method, "http": response.status, "result": data})
                      return data
              except urllib.error.HTTPError as error:
                  notice({"method": method, "http": error.code, "result": error.read().decode()})
                  raise
          request("GET", url)
          request("POST", url + "/cancel")
          for attempt in range(13):
              data = request("GET", url)
              if data.get("status") in {"deployment_cancelled", "deployment_failed", "deployment_lost", "succeed"}:
                  notice({"terminal": data["status"]})
                  break
              if attempt == 12:
                  raise RuntimeError("Pages cancellation has not reached terminal state")
              time.sleep(10)
          PYTHON
