name: Recover stalled Pages deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-pages.yml

permissions:
  pages: write

jobs:
  cancel-stalled-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel timed-out Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - << "PYTHON"
          import os
          import urllib.request
          url = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/pages/deployments/a86baad677450949f32710b6d2e9afbad3f31138/cancel"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          }
          request = urllib.request.Request(url, headers=headers, method="POST")
          with urllib.request.urlopen(request, timeout=60) as response:
              print("Cancel stalled Pages deployment: HTTP", response.status)
              assert response.status == 204
          PYTHON
